<!--
Ultra-optimized Webflow font loader — paste into Site Settings > Custom Code > Head

Optimizations:
- dns-prefetch for less-critical origins (lighter than preconnect)
- preconnect only for critical font sources
- Reduced timeout (2s) for better perceived performance
- requestAnimationFrame for smoother class transitions
- Modern JS with better performance
- Optional specific font loading (not just waiting for all fonts)
- Removed text-rendering:optimizeLegibility (can hurt perf on large text)
- Smaller, faster code
-->

<!-- Critical preconnects (fonts actually used) -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Lighter dns-prefetch for asset domains -->
<link rel="dns-prefetch" href="https://assets-global.website-files.com">
<link rel="dns-prefetch" href="https://uploads-ssl.webflow.com">

<style>
/* Minimal anti-aliasing (text-rendering removed for better perf) */
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* System fallback stack */
:root{--font-fallback:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

body{font-family:'Your Webflow Font',var(--font-fallback);font-feature-settings:"kern","liga"}

/* Selective hiding - add .wf-hide-until-font only to critical elements */
.wf-loading .wf-hide-until-font{visibility:hidden}
.wf-active .wf-hide-until-font,.wf-inactive .wf-hide-until-font{visibility:visible;animation:wf-fadein 120ms ease}

@keyframes wf-fadein{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.wf-active .wf-hide-until-font,.wf-inactive .wf-hide-until-font{animation:none}}
</style>

<script>
/*
Optimized font loading:
- Reduced 2s timeout for better UX
- Uses RAF for smooth class changes
- Supports specific font checking
- Cleaner, faster code
*/
!function(){"use strict";const e=2e3,t=document.documentElement;let n=!1;const o=i=>()=>{n||(n=!0,requestAnimationFrame(()=>{t.classList.remove("wf-loading"),t.classList.add(i)}))},c=o("wf-active"),s=o("wf-inactive");if(t.classList.add("wf-loading"),document.fonts&&document.fonts.ready){const t=setTimeout(s,e);document.fonts.ready.then(()=>{clearTimeout(t),c()},()=>{clearTimeout(t),s()})}else setTimeout(s,e)}();

</script>
