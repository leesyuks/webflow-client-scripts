/* Selective hiding - add .wf-hide-until-font only to critical elements */

.wf-active .wf-hide-until-font,.wf-inactive .wf-hide-until-font{visibility:visible;animation:wf-fadein 100ms ease-out}

@keyframes wf-fadein{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.wf-active .wf-hide-until-font,.wf-inactive .wf-hide-until-font{animation:none}}
